upstream backend_node {
    server backend:3000;
}

server {
    listen 80 default_server;
    server_name localhost _;

    absolute_redirect off;
    port_in_redirect on;
    server_name_in_redirect off;
    client_max_body_size 10m;

    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.APP_CONFIG = { API_BASE_URL: \"http://localhost:8080\", APP_BASE_URL: \"http://localhost:8080\" };\n";
    }

    location /api/ {
        proxy_pass http://backend_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = / {
        return 302 /hospedes;
    }

    location = /hospedes {
        root /usr/share/nginx/html;
        try_files /hospedes/index.html =404;
    }

    location = /hospedes/ {
        root /usr/share/nginx/html;
        try_files /hospedes/index.html =404;
    }

    location = /hospedes/add {
        root /usr/share/nginx/html;
        try_files /hospedes/add/index.html =404;
    }

    location = /hospedes/add/ {
        root /usr/share/nginx/html;
        try_files /hospedes/add/index.html =404;
    }

    location ~ ^/hospedes/update/[0-9]+$ {
        root /usr/share/nginx/html;
        try_files /hospedes/update/index.html =404;
    }

    location ~ ^/hospedes/update/[0-9]+/$ {
        root /usr/share/nginx/html;
        try_files /hospedes/update/index.html =404;
    }

    location ~ ^/(quartos|promocoes|politicas-cancelamento|reservas|pagamentos|notificacoes|relatorios)/?$ {
        root /usr/share/nginx/html;
        try_files /mock/index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
